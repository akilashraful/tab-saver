<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabSaver</title>
    <script src="tailwind.min.js"></script>
    <script src="tailwind-config-popup.js"></script>
    <link rel="stylesheet" href="fonts/phosphor-fill.css">
    <link rel="stylesheet" href="fonts/phosphor-bold.css">
    <link rel="stylesheet" href="fonts/phosphor-regular.css">
    <link rel="stylesheet" href="fonts/phosphor-thin.css">
    <style>
        :root {
            --primary: #C84028;
            --bg: #050510;
            --glass: rgba(10,10,15,0.6);
            --border: rgba(255,255,255,0.08);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --card: rgba(255,255,255,0.03);
            --input: rgba(0,0,0,0.3);
            --input-border: rgba(255,255,255,0.1);
        }
        html, body { margin:0; padding:0; width:380px; height:580px; overflow:hidden; background:var(--bg); }
        body { font-family:'Space Grotesk',sans-serif; color:var(--text); user-select:none; }
        .mono { font-family:'JetBrains Mono',monospace; }
        .bg-grid {
            background-size:40px 40px;
            background-image:linear-gradient(to right,rgba(255,255,255,0.03) 1px,transparent 1px),
                             linear-gradient(to bottom,rgba(255,255,255,0.03) 1px,transparent 1px);
        }
        .ambient-glow { background:radial-gradient(circle at 50% 0%,rgba(200,64,40,0.15),transparent 60%); position:absolute; inset:0; pointer-events:none; z-index:0; }
        .glass-panel { background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
        .glass-card { background:var(--card); border:1px solid var(--input-border); transition:all .2s ease; }
        .glass-card:hover { border-color:var(--primary); background:rgba(200,64,40,0.02); box-shadow:0 4px 12px rgba(200,64,40,0.1); }
        .clean-input { background:var(--input); border:1px solid var(--input-border); transition:all .2s ease; color:var(--text); }
        .clean-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px rgba(200,64,40,0.15); }
        .clean-input::placeholder { color:var(--muted); }
        .btn-build { background:var(--primary); position:relative; overflow:hidden; transition:all .3s ease; color:white; box-shadow:0 4px 6px -1px rgba(200,64,40,0.3); }
        .btn-build:hover { background:#b03520; box-shadow:0 8px 12px -3px rgba(200,64,40,0.4); transform:translateY(-1px); }
        .shimmer-text { background:linear-gradient(to right,#475569 20%,#cbd5e1 50%,#475569 80%); background-size:200% auto; color:transparent; -webkit-background-clip:text; background-clip:text; animation:shimmer 3s linear infinite; }
        @keyframes shimmer { to { background-position:200% center; } }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#334155; border-radius:2px; }
        .hidden { display:none !important; }
    </style>
</head>
<body class="relative flex flex-col antialiased">

<div class="fixed inset-0 bg-grid z-0 pointer-events-none"></div>
<div class="ambient-glow"></div>

<div class="relative z-10 flex flex-col w-full h-full glass-panel overflow-hidden" id="popupRoot">

  <!-- Header -->
  <header class="h-16 border-b border-white/10 flex items-center justify-between px-5 shrink-0 bg-white/5 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <img src="icons/icon48.png" class="w-9 h-9 rounded-xl object-contain" alt="TabSaver">
      <div>
        <h1 class="text-[15px] font-bold text-white tracking-wide">Tab<span class="text-[#C84028]">Saver</span></h1>
        <a href="https://neurotive.io/" target="_blank" class="text-[9px] text-slate-500 mono uppercase tracking-widest hover:text-[#C84028] transition-colors">BY NEUROTIVE</a>
      </div>
    </div>
    <button id="btnOpenDashboard" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors border border-transparent hover:border-white/10" title="Open full dashboard">
      <i class="ph-bold ph-arrows-out-simple text-[16px]"></i>
    </button>
  </header>

  <!-- Scrollable body -->
  <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-5">

    <!-- Status bar -->
    <div class="flex flex-col gap-1 mb-2">
      <span class="text-[9px] text-slate-500 mono flex items-center gap-1 uppercase tracking-widest mb-2 inline-block">
        <i class="ph-fill ph-cpu text-[#C84028]"></i> Frees Memory
      </span>
      <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-md px-2.5 py-1.5 self-start">
        <span class="text-[10px] font-bold mono text-slate-300 uppercase tracking-wider" id="tabCountLabel">Loading…</span>
      </div>
    </div>

    <!-- Active filter indicator -->
    <div id="filterBadge" class="hidden text-[10px] bg-[#C84028]/15 text-[#C84028] border border-[#C84028]/30 rounded-lg px-3 py-2 mono uppercase text-center font-bold tracking-widest flex items-center justify-center gap-2">
      <i class="ph-fill ph-funnel"></i><span id="filterBadgeText"></span>
    </div>

    <!-- Save buttons -->
    <div class="space-y-2.5">
      <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Save Action</label>
      <button id="btnSaveCurrentTab" class="btn-build w-full rounded-xl py-3.5 flex items-center justify-center gap-2 text-sm font-bold tracking-wider">
        <i class="ph-bold ph-bookmark-simple text-lg"></i>
        <span>Save Current Tab</span>
      </button>
      <button id="btnSaveAllTabs" class="glass-card w-full rounded-xl py-3 flex items-center justify-center gap-2 text-sm font-medium text-slate-300 hover:text-white group">
        <i class="ph-bold ph-files text-lg text-slate-400 group-hover:text-white transition-colors"></i>
        <span>Save All Tabs</span>
      </button>
    </div>

    <!-- Close after save toggle -->
    <label class="glass-card rounded-xl p-3 flex items-center justify-between cursor-pointer group hover:border-[#C84028]/50 transition-colors">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center group-hover:bg-[#C84028]/10 transition-colors border border-transparent group-hover:border-[#C84028]/20">
          <i class="ph-fill ph-broom text-slate-400 group-hover:text-[#C84028] transition-colors text-lg"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-slate-200">Close After Saving</p>
          <p class="text-[9px] text-slate-500 mono">Frees RAM immediately</p>
        </div>
      </div>
      <div class="relative w-10 h-5 bg-white/10 rounded-full border border-transparent [&:has(:checked)]:bg-[#C84028]/20 [&:has(:checked)]:border-[#C84028] transition-all">
        <input type="checkbox" id="chkCloseAfterSave" class="sr-only peer" />
        <div class="absolute left-1 top-1 w-3 h-3 bg-slate-400 rounded-full transition-all peer-checked:translate-x-5 peer-checked:bg-[#C84028] shadow-sm"></div>
      </div>
    </label>

    <!-- Divider -->
    <div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

    <!-- Recent sessions -->
    <div class="flex justify-between items-center px-0.5">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
        <i class="ph-fill ph-clock-counter-clockwise text-[#C84028]"></i> Recent Sessions
      </span>
      <button id="btnViewAll" class="text-[10px] text-[#C84028] hover:text-white transition-colors mono flex items-center gap-1 uppercase font-bold">
        View All <i class="ph-bold ph-arrow-right"></i>
      </button>
    </div>

    <!-- Session list -->
    <div id="sessionsList" class="flex flex-col gap-2 relative min-h-[100px]">
      <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 border border-dashed border-white/10 rounded-xl bg-white/[0.02]">
        <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center mb-3">
          <i class="ph-thin ph-cube text-2xl text-slate-500"></i>
        </div>
        <p class="text-xs text-slate-400 font-medium">No sessions saved yet.</p>
        <p class="text-[9px] text-slate-600 mono mt-1 uppercase tracking-widest shimmer-text">Start capturing above</p>
      </div>
    </div>

  </div>
</div>


<!-- Toast -->
<div id="toast" class="hidden absolute bottom-5 left-1/2 -translate-x-1/2 z-50 bg-[#0d0d18] border border-white/15 text-white px-4 py-2.5 rounded-full text-[11px] font-bold tracking-wider shadow-2xl whitespace-nowrap flex items-center gap-2">
  <i class="ph-fill ph-check-circle text-[#C84028]" id="toastIcon"></i>
  <span id="toastMessage">Done</span>
</div>

<script src="popup.js"></script>
</body>
</html>
